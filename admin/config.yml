backend:
  name: github
  repo: hilmyalsharief-star/amjad-hani-site
  branch: main
media_folder: assets/uploads
public_folder: /assets/uploads
locale: ar
site_url: https://hilmyalsharief-star.github.io/amjad-hani-site/
collections:
- name: projects
  label: المشاريع
  label_singular: مشروع
