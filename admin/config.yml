    value_field: items.*.id
    display_fields:
    - items.*.name_ar
    multiple: true
    required: false
  - name: status
    label: الحالة
    widget: select
    options:
    - label: منجز
      value: completed
    - label: قيد التنفيذ
      value: in_progress
    - label: مرحلة الفكرة
      value: concept
    default: completed
