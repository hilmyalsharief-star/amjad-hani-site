        label: العنوان (English)
        widget: string
        required: true
      - name: title_ar
        label: العنوان (العربي)
        widget: string
        required: false
      - name: text_en
        label: الوصف (English)
        widget: text
        required: false
      - name: text_ar
        label: الوصف (العربي)
        widget: text
        required: false
