# إعدادات لوحة التحكم (Sveltia CMS)
backend:
  name: github
  repo: hilmyalsharief-star/amjad-hani-site
  branch: main
media_folder: assets/uploads
public_folder: assets/uploads
collections:
- name: content
  label: محتوى الموقع
  label_singular: محتوى
  delete: false
  editor:
    preview: false
  files:
  - name: projects
    label: المشاريع (أضف / عدّل / احذف)
    file: projects.json
    format: json
    fields:
    - name: items
      label: المشاريع
      label_singular: مشروع
      widget: list
      summary: '{{fields.title_en}} — {{fields.title_ar}}'
      hint: اضغط "إضافة مشروع". اسحب العناصر لتغيير الترتيب.
      fields:
      - name: title_en
        label: اسم المشروع (English)
        widget: string
        required: true
      - name: title_ar
        label: اسم المشروع (العربي)
        widget: string
        required: false
      - name: type_en
        label: النوع (English)
        widget: string
        required: false
        hint: 'مثال: Residential · Architecture'
      - name: type_ar
        label: النوع (العربي)
        widget: string
        required: false
        hint: 'مثال: سكني · عمارة'
      - name: image
        label: صورة المشروع
        widget: image
        required: false
        choose_url: true
      - name: link
        label: رابط المشروع (اختياري)
        widget: string
        required: false
        hint: إذا حطيت رابط، الضغط على المشروع بفتحه.
      - &id001
        name: visible
        label: إظهار في الموقع؟
        widget: boolean
        required: false
        hint: ألغِ التفعيل لإخفائه بدون حذفه.
        default: true
  - name: team
    label: الفريق (أضف / عدّل / احذف)
    file: team.json
    format: json
    fields:
    - name: members
      label: أعضاء الفريق
      label_singular: عضو
      widget: list
      summary: '{{fields.name_en}} — {{fields.name_ar}}'
      fields:
      - name: name_en
        label: الاسم (English)
        widget: string
        required: true
      - name: name_ar
        label: الاسم (العربي)
        widget: string
        required: false
      - name: role_en
        label: المسمى الوظيفي (English)
        widget: string
        required: false
      - name: role_ar
        label: المسمى الوظيفي (العربي)
        widget: string
        required: false
      - name: photo
        label: الصورة
        widget: image
        required: false
        hint: يفضّل صورة عمودية (طول أكبر من العرض).
        choose_url: true
      - *id001
  - name: photos
    label: الصور (قسم التصوير)
    file: photos.json
    format: json
    fields:
    - name: photos
      label: الصور
      label_singular: صورة
      widget: list
      summary: '{{fields.alt}}'
      fields:
      - name: image
        label: الصورة
        widget: image
        required: false
        choose_url: true
      - name: alt
        label: وصف قصير للصورة
        widget: string
        required: false
        hint: للمكفوفين ومحركات البحث.
      - *id001
  - name: expertise
    label: مجالات الخبرة
    file: expertise.json
    format: json
    fields:
    - name: items
      label: المجالات
      label_singular: مجال
