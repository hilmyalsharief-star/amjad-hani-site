/* Language-specific logo lockup: the original English artwork is kept untouched. */
.brand{min-width:190px;min-height:68px}
.brand-ar{display:none;align-items:center;gap:13px;direction:ltr;white-space:nowrap}
.brand-ar-square{width:39px;height:39px;border:6px solid currentColor;display:block;flex:0 0 auto}
.brand-ar-copy{display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:2px;color:var(--ink)}
.brand-ar-copy strong{font-family:var(--arabic);font-size:27px;font-weight:600;line-height:1.15}
.brand-ar-copy small{font-family:var(--arabic);font-size:11px;font-weight:400;line-height:1.5;letter-spacing:0}
.brand-ar-rule{height:58px;width:2px;background:currentColor;margin-left:1px;display:block;flex:0 0 auto}
html[dir="rtl"] .brand>img{display:none}
html[dir="rtl"] .brand-ar{display:flex}
html[dir="rtl"] .brand{min-width:250px}
@media(max-width:980px){.brand{min-width:155px}.brand-ar-copy strong{font-size:23px}.brand-ar-copy small{font-size:9px}.brand-ar-square{width:33px;height:33px;border-width:5px}.brand-ar-rule{height:49px}html[dir="rtl"] .brand{min-width:220px}}
@media(max-width:420px){html[dir="rtl"] .brand{min-width:0}.brand-ar{gap:8px}.brand-ar-copy strong{font-size:20px}.brand-ar-copy small{font-size:8px}.brand-ar-square{width:29px;height:29px;border-width:4px}.brand-ar-rule{height:43px}}


/* Navigation refinement: clearer desktop labels and reliable mobile controls */
@media (min-width:981px){
  .nav{font-size:12px;letter-spacing:.12em;gap:clamp(22px,2.2vw,36px)}
  .lang{font-size:12px}
}
@media (max-width:980px){
  .tools{position:relative;z-index:62;gap:16px}
  .menu-btn{position:relative;z-index:63;display:block;min-width:36px;min-height:40px;padding:4px;color:var(--ink)}
  .lang{position:relative;z-index:63;padding:10px 4px;color:var(--ink)}
  .nav{z-index:61;top:100%;left:0;right:0;max-height:calc(100svh - 78px);overflow-y:auto;direction:ltr;align-items:flex-start;text-align:left;opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .22s ease,transform .22s ease,visibility .22s ease;display:flex}
  .nav.open{opacity:1;visibility:visible;transform:translateY(0)}
  html[dir="rtl"] .nav{direction:rtl;align-items:flex-end;text-align:right}
  .nav a{width:100%;padding:10px 0;font-size:13px;letter-spacing:.08em}
}
@media (max-width:620px){
  .topbar{padding:0 18px;height:72px}
  .nav{top:100%;padding:18px 22px 24px}
  html[dir="rtl"] .nav{align-items:stretch}
  .nav a{text-align:right}
  html[dir="ltr"] .nav a{text-align:left}
}

/* Mobile menu fix: nested backdrop-filter doesn't work (nav sits inside .topbar which already has one),
   so the panel stayed see-through and page text showed behind the links. Use solid backgrounds. */
@media (max-width:980px){
  .topbar{background:var(--paper)}
  .topbar.is-scrolled{background:var(--paper)}
  .nav{
    background:var(--paper);
    -webkit-backdrop-filter:none;backdrop-filter:none;
    gap:0;
    padding:8px 22px 20px;
    border-top:1px solid var(--line);
    box-shadow:0 16px 32px rgba(0,0,0,.12);
  }
  .nav a{padding:14px 0;border-bottom:1px solid var(--line)}
  .nav a:last-child{border-bottom:0}
}


/* ---- content-driven additions ---- */
[hidden]{display:none!important}
body.is-loading main,body.is-loading footer{opacity:0}
main,footer{transition:opacity .35s ease}
.team-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;margin-top:48px}
.team-grid:empty{display:none}
.team-card .team-photo{aspect-ratio:3/4;background:#dcd8cd;overflow:hidden;display:flex;align-items:center;justify-content:center;font:400 54px var(--serif);color:#9c9788}
.team-card img{width:100%;height:100%;object-fit:cover;display:block}
.team-name{font:500 22px/1.2 var(--serif);margin-top:16px}

[dir=rtl] .team-role{letter-spacing:0;font-size:12px}
.project-card>a{display:block}
.contact-side{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.contact-details{display:flex;flex-direction:column;gap:8px;align-items:flex-end;font-size:14px;letter-spacing:.04em;direction:ltr}
.contact-details a{border-bottom:1px solid rgba(247,246,242,.35);padding-bottom:2px}

مجتمع."}, {"title_en": "Engineering", "title_ar": "الهندسة", "text_en": "Integrated thinking across technical and design disciplines.", "text_ar": "تكامل الرؤية الفنية والهندسية مع التصميم."}, {"title_en": "Interiors", "title_ar": "التصميم الداخلي", "text_en": "Interior environments with a focus on material and experience.", "text_ar": "مساحات داخلية تهتم بالخامات والتجربة الإنسانية."}]}}</script>
<script>
(() => {
  const langBtn=document.getElementById('lang');
  const menuBtn=document.getElementById('menu');
  const nav=document.getElementById('nav');
  const topbar=document.querySelector('.topbar');
  let current='en';
  const updateHeader=()=>{
    const scrolled=window.scrollY>8;
    topbar.classList.toggle('is-scrolled',scrolled);
    topbar.style.boxShadow=scrolled?'0 8px 28px rgba(0,0,0,.08)':'none';
  };
  window.addEventListener('scroll',updateHeader,{passive:true}); updateHeader();

  function closeMenu(){
    nav.classList.remove('open');
    menuBtn.setAttribute('aria-expanded','false');
    menuBtn.setAttribute('aria-label',current==='ar'?'فتح القائمة':'Open menu');
    menuBtn.textContent='☰';
  }
  function setLang(next){
    current=next;
    document.documentElement.lang=next;
    document.documentElement.dir=next==='ar'?'rtl':'ltr';
    document.querySelectorAll('[data-en][data-ar]').forEach(el=>{
      const value=el.dataset[next];
      if(value!==undefined) el.innerHTML=value;
    });
    langBtn.textContent=next==='en'?'AR':'EN';
    langBtn.setAttribute('aria-label',next==='en'?'Switch to Arabic':'التبديل إلى الإنجليزية');
    closeMenu();
  }
  langBtn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();setLang(current==='en'?'ar':'en');});
  menuBtn.addEventListener('click',e=>{
    e.preventDefault();e.stopPropagation();
    const opened=nav.classList.toggle('open');
    menuBtn.setAttribute('aria-expanded',String(opened));
    menuBtn.textContent=opened?'×':'☰';
    menuBtn.setAttribute('aria-label',opened?(current==='ar'?'إغلاق القائمة':'Close menu'):(current==='ar'?'فتح القائمة':'Open menu'));
  });
  nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',closeMenu));
  document.addEventListener('click',e=>{if(!topbar.contains(e.target)) closeMenu();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape') closeMenu();});

  const socialProfiles={whatsapp:'',facebook:'',instagram:'',linkedin:''};
  document.querySelectorAll('[data-social]').forEach(link=>{
    const key=link.dataset.social;
    link.addEventListener('click',event=>{
      const url=socialProfiles[key];
      if(!url){
        event.preventDefault();
        document.getElementById('social-note').hidden=false;
        document.getElementById('social-note').textContent=current==='ar'
          ?'أرسل رابط صفحة '+key+' الرسمية حتى نربطها بشكل صحيح.'
          :'Please provide the official '+key+' URL so this icon can open the correct page.';
        return;
      }
      link.href=url; link.target='_blank'; link.rel='noopener noreferrer';
    });
  });

  /* ===== Content loader: reads /content/*.json (edited from /admin) and builds the page ===== */
  const SEED=JSON.parse(document.getElementById('seed').textContent);
  const FILES={site:'content/site.json',projects:'content/projects.json',team:'content/team.json',photos:'content/photos.json',expertise:'content/expertise.json'};
  const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const fmt=s=>esc(s).replace(/\r?\n/g,'<br>');
  const attr=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
  const getPath=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
  const visible=i=>i&&i.visible!==false;
  const pair=(en,ar)=>({en:fmt(en),ar:fmt(ar||en)});
  const bi=(tag,cls,p)=>`<${tag} class="${cls}" data-en="${attr(p.en)}" data-ar="${attr(p.ar)}">${current==='ar'?p.ar:p.en}</${tag}>`;
  const cssUrl=u=>'url('+JSON.stringify(String(u))+')';

  function bind(site){
    document.querySelectorAll('[data-c]').forEach(el=>{
      const v=getPath(site,el.dataset.c);
      let en,ar;
      if(v&&typeof v==='object'){en=fmt(v.en);ar=fmt(v.ar||v.en);} else {en=ar=fmt(v);}
      el.dataset.en=en; el.dataset.ar=ar;
      el.innerHTML=current==='ar'?ar:en;
      (el.closest('[data-hide-empty]')||el).hidden=!(en||ar);
    });
    document.querySelectorAll('[data-img]').forEach(el=>{
      const u=getPath(site,el.dataset.img);
      if(u) el.style.setProperty('--img',cssUrl(u));
    });
    if(site.seo&&site.seo.title) document.title=site.seo.title;
    if(site.seo&&site.seo.description){const m=document.querySelector('meta[name="description"]'); if(m) m.content=site.seo.description;}
  }

  function renderLists(D){
    const projects=(D.projects.items||[]).filter(visible).map(p=>{
      const t=pair(p.title_en,p.title_ar), ty=pair(p.type_en,p.type_ar);
      const inner=`<div class="project-image"><img loading="lazy" src="${attr(p.image)}" alt="${attr(p.title_en)}"></div><div class="project-meta"><div>${bi('div','project-title',t)}${bi('div','project-type',ty)}</div><span>↗</span></div>`;
      return `<article class="project-card">${p.link?`<a href="${attr(p.link)}">${inner}</a>`:inner}</article>`;
    });
    document.getElementById('project-grid').innerHTML=projects.join('');

    document.getElementById('photo-grid').innerHTML=(D.photos.photos||[]).filter(visible)
      .map(p=>`<img loading="lazy" src="${attr(p.image)}" alt="${attr(p.alt||'')}">`).join('');

    const members=(D.team.members||[]).filter(visible);
    document.getElementById('team-grid').innerHTML=members.map(m=>{
      const n=pair(m.name_en,m.name_ar), r=pair(m.role_en,m.role_ar);
      const photo=m.photo?`<img loading="lazy" src="${attr(m.photo)}" alt="${attr(m.name_en)}">`:esc((m.name_en||'?').trim().charAt(0));
      return `<div class="team-card"><div class="team-photo">${photo}</div>${bi('div','team-name',n)}${bi('div','team-role',r)}</div>`;
    }).join('');
    document.getElementById('team-note').hidden=members.length>0||document.getElementById('team-note').hidden;

    document.getElementById('expertise-grid').innerHTML=(D.expertise.items||[]).map((x,i)=>{
      const t=pair(x.title_en,x.title_ar), d=pair(x.text_en,x.text_ar);
      return `<div class="expertise-item"><span class="expertise-num">${String(i+1).padStart(2,'0')}</span><h3 data-en="${attr(t.en)}" data-ar="${attr(t.ar)}">${current==='ar'?t.ar:t.en}</h3><p data-en="${attr(d.en)}" data-ar="${attr(d.ar)}">${current==='ar'?d.ar:d.en}</p></div>`;
    }).join('');
  }

  function renderLinks(site){
    const c=site.contact||{}, f=site.footer||{};
    const details=[];
    if(c.email) details.push(`<a href="mailto:${attr(c.email)}">${esc(c.email)}</a>`);
    if(c.phone) details.push(`<a href="tel:${attr(String(c.phone).replace(/[^+\d]/g,''))}">${esc(c.phone)}</a>`);
    document.getElementById('contact-details').innerHTML=details.join('');
    if(details.length) document.getElementById('contact-note').hidden=true;
    const apply=(site.careers&&site.careers.apply_link)||(c.email?'mailto:'+c.email:'');
    if(apply) document.getElementById('careers-link').href=apply;
    Object.assign(socialProfiles,{whatsapp:f.whatsapp||'',facebook:f.facebook||'',instagram:f.instagram||'',linkedin:f.linkedin||''});
    const any=Object.values(socialProfiles).some(Boolean);
    if(any){
      document.getElementById('social-note').hidden=true;
      document.querySelectorAll('[data-social]').forEach(a=>{
        const u=socialProfiles[a.dataset.social];
        a.hidden=!u;
        if(u){a.href=u;a.target='_blank';a.rel='noopener noreferrer';}
      });
    }
  }

  const loadJson=(k)=>fetch(FILES[k]+'?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok) throw new Error(r.status);return r.json();}).catch(()=>SEED[k]);
  Promise.all(Object.keys(FILES).map(loadJson)).then(arr=>{
    const D={}; Object.keys(FILES).forEach((k,i)=>D[k]=arr[i]);
    bind(D.site); renderLists(D); renderLinks(D.site);
    setLang(current);
  }).finally(()=>document.body.classList.remove('is-loading'));
  document.getElementById('year').textContent=new Date().getFullYear();
})();
</script>
</body></html>
